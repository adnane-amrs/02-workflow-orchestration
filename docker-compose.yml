version: '3.8'

volumes:
  ny_taxi_postgres_data:
  pgadmin_data:
  kestra_postgres_data:
  kestra_data:

services:
  # -------------------------------------------------------------
  # 1. Target Database for Data Engineering Course (NY Taxi Data)
  # -------------------------------------------------------------
  pgdatabase:
    image: postgres:17-alpine
    container_name: pgdatabase
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=ny_taxi
    volumes:
      - ny_taxi_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # -------------------------------------------------------------
  # 2. Database Management UI
  # -------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8085:80"

  # -------------------------------------------------------------
  # 3. Kestra's Internal Backend Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: kestra_postgres
    volumes:
      - kestra_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 4. Kestra Orchestrator Engine
  # -------------------------------------------------------------
  kestra:
    image: kestra/kestra:latest
    container_name: kestra
    pull_policy: always
    stop_grace_period: 6m
    user: "root"
    command: server standalone
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SECRET_AZURE_TENANT_ID: ${SECRET_AZURE_TENANT_ID}
      SECRET_AZURE_CLIENT_ID: ${SECRET_AZURE_CLIENT_ID}
      SECRET_AZURE_CLIENT_SECRET: ${SECRET_AZURE_CLIENT_SECRET}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/