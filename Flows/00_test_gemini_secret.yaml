id: test_gemini_secret
namespace: zoomcamp

tasks:
  - id: verify_secret
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - echo "Secret key loaded successfully! Key length is $(echo -n "{{ secret('GEMINI_API_KEY') }}" | wc -c) chars."